services:
  db:
    image: postgres:16
    container_name: taskflow-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data

volumes:
  taskflow-db-data:
